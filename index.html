<!DOCTYPE html>

    <meta name="theme-color" content="#1e1e1e" />

    <!-- Primary Meta Tags -->
    <title>EarthViewer - アングル検討ツール</title>
    <meta
      name="description"
      content="EarthViewerは、不動産広告や建築パース制作者向けの無料3Dカメラアングル検討ツールです。高さ・画角を数値で調整し、複数の視点をKMLで保存・共有。Google Earthとの連携で、プレゼンテーションを強力にサポートします。"
    />
    <meta
      name="keywords"
      content="カメラアングル, 3Dマップ, KML, Cesium, Google Earth, 不動産広告, 建築パース, アングル検討, 景観シミュレーション, ドローン空撮, EarthViewer"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://example.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "EarthViewer",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "不動産広告や建築パース制作者向けの3Dマップカメラアングル検討ツール。Cesiumベースの直感的な操作で高さや画角を精密に調整し、複数のアングルをKML形式で保存・共有・エクスポートできます。",
